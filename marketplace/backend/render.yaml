services:
  - type: web
    name: uae-market-api
    runtime: python
    plan: free
    rootDir: marketplace/backend
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /api/health
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MARKET_SUCCESS_URL
        sync: false
      - key: MARKET_CANCEL_URL
        sync: false
      - key: MARKET_DB
        value: /tmp/market.db
