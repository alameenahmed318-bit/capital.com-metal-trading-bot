<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إتمام الطلب — UAE Market</title><link rel="stylesheet" href="styles.css"></head><body><div class="topbar">🇦🇪 توصيل داخل الإمارات • الدفع الآمن قريباً</div><header><a class="brand" href="index.html"><b>UAE</b><span>Market</span></a><a class="cartBtn" href="index.html">← العودة للمتجر</a></header><main style="max-width:900px;padding:35px 5%"><div class="sectionHead" style="padding:0"><div><small>ORDER</small><h2>إتمام الطلب</h2></div></div><div id="summary" class="card" style="margin-top:20px;padding:20px"></div><form id="checkoutForm" class="card" style="margin-top:18px;padding:22px"><h3>بيانات التوصيل</h3><input required name="name" placeholder="الاسم الكامل"><input required type="email" name="email" placeholder="البريد الإلكتروني"><input required name="phone" placeholder="رقم الهاتف"><select required name="emirate"><option value="">اختر الإمارة</option><option>أبوظبي</option><option>دبي</option><option>الشارقة</option><option>عجمان</option><option>أم القيوين</option><option>رأس الخيمة</option><option>الفجيرة</option></select><textarea required name="address" placeholder="العنوان بالتفصيل"></textarea><button class="primary full" type="submit">تأكيد الطلب</button><p id="checkoutMsg" style="color:#777;text-align:center"></p></form></main><script src="store.js"></script><script>function render(){const c=cartItems();document.getElementById("summary").innerHTML=c.length?c.map(x=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee"><span>${x.emoji} ${x.name} × ${x.qty}</span><b>AED ${x.price*x.qty}</b></div>`).join("")+`<h3 style="text-align:left">الإجمالي: AED ${cartTotal(c)}</h3>`:"<p>السلة فارغة. <a href='index.html'>ارجع للمتجر</a></p>"}render();document.getElementById("checkoutForm").addEventListener("submit",e=>{e.preventDefault();const c=cartItems();if(!c.length)return;const data=Object.fromEntries(new FormData(e.target));const order={orderId:"UM-"+Date.now(),customer:data,items:c,total:cartTotal(c),currency:"AED",status:"pending_payment",createdAt:new Date().toISOString()};localStorage.setItem("uae_market_pending_order",JSON.stringify(order));document.getElementById("checkoutMsg").textContent="تم تجهيز الطلب رقم "+order.orderId+" — الدفع الحقيقي سيتم ربطه في الخطوة التالية.";});</script></body></html>
