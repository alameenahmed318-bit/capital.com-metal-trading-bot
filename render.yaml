services:
  - type: web
    name: al-zool-gold-sniper-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python marketplace/backend/app.py
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OWNER_EMAIL
        value: Meenosvn1@gmail.com
      - key: OWNER_PASSWORD
        sync: false
