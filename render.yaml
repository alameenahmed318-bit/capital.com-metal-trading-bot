services:
  - type: web
    name: al-zool-central-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python marketplace/backend/app.py
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
