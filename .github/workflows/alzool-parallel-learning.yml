name: AL-ZOOL persistent shadow learning
on:
  push:
    branches: ['research/parallel-persistent-learning-20261126']
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install numpy==1.26.4 scikit-learn==1.6.1 transformers==4.57.0
      - name: Tests
        env:
          PYTHONPATH: marketplace/backend:research
        run: |
          python -m compileall -q marketplace/backend research/parallel_shadow_worker.py research/arena_live_worker.py research/parallel_memory.py
          python tests/test_parallel_learning.py
          python tests/test_parallel_shadow.py
          python -m unittest discover -s tests -p 'test_arena_master.py'
          python -m unittest discover -s tests -p 'test_master_entry_review.py'
          python -m unittest discover -s tests -p 'test_smart_profit_advice.py'
          python - <<'PY'
          import numpy as np,json
          from parallel_shadow_worker import fit,predict
          for name in ('gold','btc'):
              b=np.asarray(json.load(open('tests/fixtures/v3_replacement_'+name+'_m1.json'))['bars'],dtype=float)
              m=fit(b,1,(),10);p,a=predict(m,b[-61:]);assert len(p)==6 and a>0
              print(name,p)
          PY
