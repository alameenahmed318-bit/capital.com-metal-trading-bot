name: UAE Business AI Agent

on:
  workflow_dispatch:
    inputs:
      approval_id:
        description: "Pending approval ID (e.g. APR-...)"
        required: false
        type: string
      approval_decision:
        description: "Approval decision"
        required: false
        default: "approve"
        type: choice
        options:
          - approve
          - reject
      dry_run:
        description: "TRUE = simulation only; FALSE = create the approved Stripe Sandbox invoice"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: business-ai-agent-main
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install business agent dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Run business agent
        env:
          # Scheduled runs are always safe/dry-run. Manual runs use the checkbox value exactly.
          AGENT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'true' }}
          APPROVAL_REQUIRED_FOR_MONEY: "true"
          APPROVAL_REQUIRED_FOR_CONTRACTS: "true"
          APPROVAL_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.approval_id || '' }}
          APPROVAL_DECISION: ${{ github.event_name == 'workflow_dispatch' && inputs.approval_decision || 'approve' }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
        run: python -m business_agent.agent
      - name: Persist agent state safely
        run: |
          git config user.name "uae-business-ai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business_agent/state.json
          if git diff --cached --quiet; then
            echo "No state changes to persist."
            exit 0
          fi
          git commit -m "chore: persist business agent state"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
