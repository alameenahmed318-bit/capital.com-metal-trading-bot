name: AL-ZOOL parallel monitoring safety
on:
  push:
    branches: ['research/master-parallel-shadow-20261126']
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and isolation unit tests
        env:
          PYTHONPATH: marketplace/backend
        run: |
          python -m compileall -q marketplace/backend research/parallel_shadow_worker.py
          python tests/test_parallel_shadow.py
          python -m unittest discover -s tests -p 'test_arena_master.py'
          python -m unittest discover -s tests -p 'test_master_entry_review.py'
          python -m unittest discover -s tests -p 'test_smart_profit_advice.py'
      - name: Worker CPU smoke training
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install numpy==1.26.4 scikit-learn==1.6.1 transformers==4.57.0
          PYTHONPATH=research python - <<'PY'
          import json,numpy as np
          from parallel_shadow_worker import fit,predict
          for name in ('gold','btc'):
              b=np.asarray(json.load(open('tests/fixtures/v3_replacement_'+name+'_m1.json'))['bars'],dtype=float)
              m=fit(b,1);p,a=predict(m,b[-61:])
              print(name,p)
              assert len(p)==6 and a>0
          PY
