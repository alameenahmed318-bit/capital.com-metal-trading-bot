name: Capital Unified Account Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  # Serialize account access without dropping pending runs.
  # GitHub's default queue is single-slot and cancels older pending runs.
  # queue:max keeps scheduled/manual AI bot runs in line.
  group: capital-account-state
  cancel-in-progress: false
  queue: max
permissions:
  contents: write

jobs:
  account-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sync to latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "EXECUTION_SHA=$(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: AI architecture self-check
        run: python ai_self_check_v2.py

      - name: Run Gold AI
        run: python gold_ai_bot.py
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_EMAIL: ${{ secrets.CAPITAL_EMAIL }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_BASE_URL: ${{ secrets.CAPITAL_BASE_URL }}
          CAPITAL_BASE_DEMO_URL: ${{ secrets.CAPITAL_BASE_DEMO_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IS_DEMO: ${{ secrets.IS_DEMO }}
          BALANCE_CAP: ${{ vars.BALANCE_CAP || '1000' }}
          STRATEGY: ${{ vars.STRATEGY || 'baseline' }}
          VOL_MANAGED_SIZING: "true"
          RISK_PER_TRADE: ${{ vars.RISK_PER_TRADE || '0.03' }}
          VOL_REGIME_MIN: ${{ vars.VOL_REGIME_MIN || '1.05' }}
          GITHUB_USERNAME: alameenahmed318-bit
          GITHUB_REPO: capital.com-metal-trading-bot

      - name: Run Multi-Market AI
        run: python multi_market_ai_bot.py
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_EMAIL: ${{ secrets.CAPITAL_EMAIL }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_BASE_URL: ${{ secrets.CAPITAL_BASE_URL }}
          CAPITAL_BASE_DEMO_URL: ${{ secrets.CAPITAL_BASE_DEMO_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IS_DEMO: ${{ secrets.IS_DEMO }}
          BALANCE_CAP: ${{ vars.BALANCE_CAP || '1000' }}
          STRATEGY: ${{ vars.STRATEGY || 'baseline' }}
          VOL_MANAGED_SIZING: "true"
          RISK_PER_TRADE: ${{ vars.RISK_PER_TRADE || '0.03' }}
          VOL_REGIME_MIN: ${{ vars.VOL_REGIME_MIN || '1.05' }}
          GITHUB_USERNAME: alameenahmed318-bit
          GITHUB_REPO: capital.com-metal-trading-bot

      - name: Run broker trade ledger
        run: python trade_ledger.py
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_EMAIL: ${{ secrets.CAPITAL_EMAIL }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_BASE_URL: ${{ secrets.CAPITAL_BASE_URL }}
          CAPITAL_BASE_DEMO_URL: ${{ secrets.CAPITAL_BASE_DEMO_URL }}
          IS_DEMO: ${{ secrets.IS_DEMO }}
          TRADE_LEDGER_LOOKBACK_DAYS: "30"

      - name: Quant validation
        run: python quant_validation.py
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_EMAIL: ${{ secrets.CAPITAL_EMAIL }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_BASE_URL: ${{ secrets.CAPITAL_BASE_URL }}
          CAPITAL_BASE_DEMO_URL: ${{ secrets.CAPITAL_BASE_DEMO_URL }}
          IS_DEMO: ${{ secrets.IS_DEMO }}
          BALANCE_CAP: ${{ vars.BALANCE_CAP || '1000' }}
          STRATEGY: ${{ vars.STRATEGY || 'baseline' }}
          VOL_MANAGED_SIZING: "true"
          RISK_PER_TRADE: ${{ vars.RISK_PER_TRADE || '0.03' }}
          VOL_REGIME_MIN: ${{ vars.VOL_REGIME_MIN || '1.05' }}

      - name: Build realized AI dataset and registry
        run: python ai_dataset_job.py

      - name: Persist all bot state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STATE_DIR="$(mktemp -d)"
          trap 'rm -rf "$STATE_DIR"' EXIT
          STATE_FILES=(
            multi_market_strategy_positions.json multi_market_trades_state.json
            multi_market_bot_safety_state.json multi_market_open_positions.json
            multi_market_execution_quality.json multi_market_entry_rejections.json
            gold_ai_strategy_positions.json gold_ai_trades_state.json
            gold_ai_bot_safety_state.json gold_ai_open_positions.json
            gold_ai_execution_quality.json gold_ai_entry_rejections.json
            trades.db stats.json quant_validation.json ai_outcomes.db
            ai_training_dataset.parquet ai_model_registry.json
            broker_trade_ledger.json broker_trade_ledger.csv
          )
          for f in "${STATE_FILES[@]}"; do
            if [ -e "$f" ]; then cp -a "$f" "$STATE_DIR/$f"; fi
          done
          git reset --hard HEAD
          git pull --rebase -X theirs origin main
          for f in "${STATE_FILES[@]}"; do
            if [ -e "$STATE_DIR/$f" ]; then cp -a "$STATE_DIR/$f" "$f"; fi
          done
          EXISTING_STATE_FILES=()
          for f in "${STATE_FILES[@]}"; do
            if [ -e "$f" ]; then EXISTING_STATE_FILES+=( "$f" ); fi
          done
          if [ "${#EXISTING_STATE_FILES[@]}" -eq 0 ]; then exit 0; fi
          git add -f "${EXISTING_STATE_FILES[@]}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update unified bot state [skip ci]"
          git push origin main || {
            git pull --rebase -X theirs origin main
            git push origin main
          }
