name: Capital FX AI Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
# FX has its own execution queue. Metals uses a separate queue, so neither workflow waits for the other.
concurrency:
  # Keep FX runs ordered without cancelling pending FX runs.
  group: capital-fx-ai
  cancel-in-progress: false
  queue: max
permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Sync to latest main before running
        run: |
          set -euo pipefail
          # Scheduled runs can wait in the account-wide concurrency queue.
          # The event checkout may therefore point to an older commit by the
          # time this job actually starts. Always execute the newest main code.
          git fetch origin main
          git reset --hard origin/main
          echo "EXECUTION_SHA=$(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Capital FX AI bot
        run: python fx_ai_bot.py
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_EMAIL: ${{ secrets.CAPITAL_EMAIL }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_BASE_URL: ${{ secrets.CAPITAL_BASE_URL }}
          CAPITAL_BASE_DEMO_URL: ${{ secrets.CAPITAL_BASE_DEMO_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          IS_DEMO: ${{ secrets.IS_DEMO }}
          BALANCE_CAP: ${{ vars.BALANCE_CAP }}
          STRATEGY: ${{ vars.STRATEGY }}
          VOL_MANAGED_SIZING: "true"
          RISK_PER_TRADE: ${{ vars.RISK_PER_TRADE }}
          VOL_REGIME_MIN: ${{ vars.VOL_REGIME_MIN }}
          GITHUB_USERNAME: alameenahmed318-bit
          GITHUB_REPO: capital.com-metal-trading-bot
      - name: Run broker trade ledger
        run: python trade_ledger.py
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_EMAIL: ${{ secrets.CAPITAL_EMAIL }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_BASE_URL: ${{ secrets.CAPITAL_BASE_URL }}
          CAPITAL_BASE_DEMO_URL: ${{ secrets.CAPITAL_BASE_DEMO_URL }}
          IS_DEMO: ${{ secrets.IS_DEMO }}
          TRADE_LEDGER_LOOKBACK_DAYS: "30"
          TRADE_LEDGER_JSON: "fx_broker_trade_ledger.json"
          TRADE_LEDGER_CSV: "fx_broker_trade_ledger.csv"

      - name: Run quant validation
        run: python quant_validation.py
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_EMAIL: ${{ secrets.CAPITAL_EMAIL }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_BASE_URL: ${{ secrets.CAPITAL_BASE_URL }}
          CAPITAL_BASE_DEMO_URL: ${{ secrets.CAPITAL_BASE_DEMO_URL }}
          IS_DEMO: ${{ secrets.IS_DEMO }}
          BALANCE_CAP: ${{ vars.BALANCE_CAP }}
          STRATEGY: ${{ vars.STRATEGY }}
          VOL_MANAGED_SIZING: "true"
          RISK_PER_TRADE: ${{ vars.RISK_PER_TRADE }}
          VOL_REGIME_MIN: ${{ vars.VOL_REGIME_MIN }}
          QUANT_VALIDATION_PATH: "fx_quant_validation.json"

      - name: Build realized AI dataset and registry
        run: python ai_dataset_job.py
        env:
          AI_OUTCOMES_DB: "fx_ai_outcomes.db"
          AI_DATASET_PATH: "fx_ai_training_dataset.parquet"
          AI_MODEL_REGISTRY: "fx_ai_model_registry.json"
          AI_MODEL_REGISTRY_PREFIX: "fx_"
          AI_LEARNING_REPORT: "fx_ai_learning_report.json"

      - name: Persist bot state
        if: ${{ always() }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve bot-generated state before syncing. The bot writes tracked
          # JSON/DB files during the run, so a pull --rebase can fail if the
          # workspace is dirty. Reset only the runner-local tracked changes,
          # then restore the freshly generated state and commit it.
          STATE_DIR="$(mktemp -d)"
          trap 'rm -rf "$STATE_DIR"' EXIT

          STATE_FILES=(
            fx_ai_strategy_positions.json
            fx_ai_trades_state.json
            fx_ai_bot_safety_state.json
            fx_ai_open_positions.json
            fx_ai_execution_quality.json
            fx_ai_entry_rejections.json
            fx_ai_entry_candle_state.json
            fx_quant_validation.json
            fx_ai_outcomes.db
            fx_ai_training_dataset.parquet
            fx_ai_model_registry.json
            fx_ai_model_registry_EURUSD.json
            ai_model_registry_GBPUSD.json
            ai_model_registry_USDJPY.json
            ai_model_registry_USDCHF.json
            ai_model_registry_USDCAD.json
            ai_model_registry_AUDUSD.json
            ai_model_registry_NZDUSD.json
            ai_model_registry_EURGBP.json
            ai_model_registry_EURJPY.json
            ai_model_registry_GBPJPY.json
            ai_model_registry_AUDJPY.json
            ai_model_registry_EURCHF.json
            ai_model_registry_GBPCHF.json
            ai_model_registry_AUDCAD.json
            ai_model_registry_AUDCHF.json
            ai_model_registry_NZDJPY.json
            ai_model_registry_CADJPY.json
            ai_model_registry_EURUSD_W.json
            fx_ai_learning_report.json
            fx_broker_trade_ledger.json
            fx_broker_trade_ledger.csv
          )

          for f in "${STATE_FILES[@]}"; do
            if [ -e "$f" ]; then
              cp -a "$f" "$STATE_DIR/$f"
            fi
          done

          git reset --hard HEAD
          git pull --rebase -X theirs origin main

          for f in "${STATE_FILES[@]}"; do
            if [ -e "$STATE_DIR/$f" ]; then
              cp -a "$STATE_DIR/$f" "$f"
            fi
          done

          EXISTING_STATE_FILES=()
          for f in "${STATE_FILES[@]}"; do
            if [ -e "$f" ]; then
              EXISTING_STATE_FILES+=( "$f" )
            fi
          done

          if [ "${#EXISTING_STATE_FILES[@]}" -eq 0 ]; then
            echo "No FX AI state files exist to persist."
            exit 0
          fi

          git add -f "${EXISTING_STATE_FILES[@]}"
          if git diff --cached --quiet; then
            echo "No state changes to persist."
            exit 0
          fi

          git commit -m "Update FX AI state [skip ci]"

          # Retry once if another repository update lands between pull and push.
          git push origin main || {
            git pull --rebase -X theirs origin main
            git push origin main
          }
