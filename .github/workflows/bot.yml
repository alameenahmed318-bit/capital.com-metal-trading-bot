name: Metals Trading Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

# Prevent overlapping runs so two bot instances cannot trade at the same time.
concurrency:
  group: capital-metal-trading-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Capital bot
        run: python bot.py
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_EMAIL: ${{ secrets.CAPITAL_EMAIL }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_BASE_URL: ${{ secrets.CAPITAL_BASE_URL }}
          CAPITAL_BASE_DEMO_URL: ${{ secrets.CAPITAL_BASE_DEMO_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IS_DEMO: ${{ secrets.IS_DEMO }}
          BALANCE_CAP: ${{ vars.BALANCE_CAP }}
          STRATEGY: ${{ vars.STRATEGY }}
          VOL_MANAGED_SIZING: "true"
          RISK_PER_TRADE: ${{ vars.RISK_PER_TRADE }}
          VOL_REGIME_MIN: ${{ vars.VOL_REGIME_MIN }}
          GITHUB_USERNAME: alameenahmed318-bit
          GITHUB_REPO: capital.com-metal-trading-bot
      - name: Run Binance bot when explicitly enabled
        if: ${{ vars.BINANCE_ENABLED == 'true' }}
        run: python binance_bot.py
        env:
          GITHUB_USERNAME: alameenahmed318-bit
          GITHUB_REPO: capital.com-metal-trading-bot
          BINANCE_ENABLED: ${{ vars.BINANCE_ENABLED }}
          BINANCE_TRADING_ENABLED: ${{ vars.BINANCE_TRADING_ENABLED }}
          BINANCE_TESTNET: ${{ vars.BINANCE_TESTNET }}
          BINANCE_SYMBOLS: ${{ vars.BINANCE_SYMBOLS }}
          BINANCE_RISK_PER_TRADE: ${{ vars.BINANCE_RISK_PER_TRADE }}
          BINANCE_MAX_POSITION_RISK: ${{ vars.BINANCE_MAX_POSITION_RISK }}
          BINANCE_LEVERAGE: ${{ vars.BINANCE_LEVERAGE }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
      - name: Run quant validation
        run: python quant_validation.py
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_EMAIL: ${{ secrets.CAPITAL_EMAIL }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_BASE_URL: ${{ secrets.CAPITAL_BASE_URL }}
          CAPITAL_BASE_DEMO_URL: ${{ secrets.CAPITAL_BASE_DEMO_URL }}
          IS_DEMO: ${{ secrets.IS_DEMO }}
          BALANCE_CAP: ${{ vars.BALANCE_CAP }}
          STRATEGY: ${{ vars.STRATEGY }}
          VOL_MANAGED_SIZING: "true"
          RISK_PER_TRADE: ${{ vars.RISK_PER_TRADE }}
          VOL_REGIME_MIN: ${{ vars.VOL_REGIME_MIN }}

      - name: Persist bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f trades.db stats.json trades_state.json bot_safety_state.json open_positions.json execution_quality.json quant_validation.json
          git diff --cached --quiet || git commit -m "Update trades.db and stats.json [skip ci]"
          git pull --rebase origin main && git push origin main || \
            (git pull --rebase origin main && git push origin main)
