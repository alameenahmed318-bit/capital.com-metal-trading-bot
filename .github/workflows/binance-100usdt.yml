name: Binance 100 USDT Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: binance-100-usdt-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Binance 100 USDT bot
        run: python binance_bot_100.py
        env:
          BINANCE_ENABLED: "true"
          BINANCE_TRADING_ENABLED: "true"
          BINANCE_TESTNET: "true"
          BINANCE_SYMBOLS: "BTCUSDT,ETHUSDT"
          BINANCE_RISK_PER_TRADE: "0.01"
          BINANCE_MAX_POSITION_RISK: "0.02"
          BINANCE_LEVERAGE: "1"
          BINANCE_SL_ATR_MULT: "2.0"
          BINANCE_TP_ATR_MULT: "3.0"
          BINANCE_CAPITAL_USDT: "100"
          BINANCE_MAX_DAILY_LOSS_PCT: "0.03"
          BINANCE_MAX_PORTFOLIO_RISK: "0.03"
          BINANCE_API_KEY: ${{ secrets.BINANCE_100_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_100_API_SECRET }}
