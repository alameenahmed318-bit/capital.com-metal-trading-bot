name: AL-ZOOL Web Engine Checks
on:
  push:
    branches: [alzool-gold-sniper-web]
  pull_request:
    branches: [alzool-gold-sniper-web]
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile web gateway and engine
        run: python -m py_compile marketplace/backend/app.py server_engine/engine.py server_engine/service.py server_engine/supabase_gateway.py
      - name: Run engine tests
        working-directory: server_engine
        run: python -m unittest discover -s tests -v
