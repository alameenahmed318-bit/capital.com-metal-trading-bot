name: Connection resilience and policy regression
on:
  push:
    branches: [fix/connection-resilience-20261127]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q marketplace/backend tests
      - run: |
          python -m unittest discover -s tests -p 'test_connection_resilience.py' -v
          python -m unittest discover -s tests -p 'test_dual_market_gateway.py' -v
          python -m unittest discover -s tests -p 'test_telemetry_latency.py' -v
          python -m unittest discover -s tests -p 'test_owner_decisions.py' -v
          python -m unittest discover -s tests -p 'test_owner_recovery.py' -v
          python -m unittest discover -s tests -p 'test_btc_market_isolation.py' -v
          python -m unittest discover -s tests -p 'test_live_learning.py' -v
