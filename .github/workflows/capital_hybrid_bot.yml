name: Capital Hybrid Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: capital-hybrid-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: Run hybrid FX bot
        env:
          CAPITAL_BASE_URL: ${{ secrets.CAPITAL_BASE_URL }}
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_EMAIL: ${{ secrets.CAPITAL_EMAIL }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          TRADE_SIZE: ${{ secrets.TRADE_SIZE || '0.01' }}
          DRY_RUN: "false"
          MAX_INITIAL_LOSS_AED: "10"
          PROFIT_PROTECT_TRIGGER_AED: "0.25"
          PROFIT_STAGE_2_AED: "0.50"
          PROFIT_ARM_AED: "1.00"
          PROFIT_FLOOR_AED: "0.05"
          PROFIT_LOCK_AED: "0.25"
          TRAIL_GIVEBACK_AED: "1.00"
          PROFIT_TRAIL_RATIO: "0.30"
          ADD_ON_MIN_PROFIT_AED: "0.20"
          ORDER_COOLDOWN_SECONDS: "120"
          HISTORY_REFRESH_SECONDS: "60"
          RUN_SECONDS: "240"
        run: python bot.py

      - name: Save bot ownership state
        if: always()
        run: |
          touch bot_state.json
          git config user.name "capital-hybrid-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The bot can finish on an older checkout while main has advanced.
          # Preserve this run's ownership state, reset to the latest main, merge the
          # state there, then commit/push. This avoids rebase conflicts in bot_state.json.
          python - <<'PY'
          import json
          from pathlib import Path

          local_path = Path("bot_state.json")
          try:
              local = json.loads(local_path.read_text() or "{}")
          except Exception:
              local = {}

          Path("/tmp/local_bot_state.json").write_text(
              json.dumps(local, sort_keys=True) + "\n"
          )
          PY

          git fetch origin main
          git reset --hard origin/main

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          local_path = Path("/tmp/local_bot_state.json")
          try:
              local = json.loads(local_path.read_text() or "{}")
          except Exception:
              local = {}

          try:
              remote_text = subprocess.check_output(
                  ["git", "show", "origin/main:bot_state.json"],
                  text=True,
                  stderr=subprocess.DEVNULL,
              )
              remote = json.loads(remote_text or "{}")
          except Exception:
              remote = {}

          merged = dict(remote) if isinstance(remote, dict) else {}
          remote_owned = remote.get("owned", {}) if isinstance(remote, dict) else {}
          local_owned = local.get("owned", {}) if isinstance(local, dict) else {}

          owned = dict(remote_owned) if isinstance(remote_owned, dict) else {}
          if isinstance(local_owned, dict):
              owned.update(local_owned)

          merged["owned"] = owned
          Path("bot_state.json").write_text(
              json.dumps(merged, indent=2, sort_keys=True) + "\n"
          )
          PY

          git add bot_state.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update FX bot ownership state"
            git push origin HEAD:main
          fi
