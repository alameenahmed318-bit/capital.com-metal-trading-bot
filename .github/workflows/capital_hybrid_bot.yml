name: GOLD Micro Scalper

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: gold-micro-scalper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt websocket-client

      - name: Run GOLD-only bot
        env:
          CAPITAL_BASE_URL: ${{ secrets.CAPITAL_BASE_URL }}
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_EMAIL: ${{ secrets.CAPITAL_EMAIL }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          DRY_RUN: "false"
          RUN_SECONDS: "240"
        run: python bot.py

      - name: Save GOLD bot state
        if: always()
        run: |
          git config user.name "gold-micro-scalper"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_state.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update GOLD bot state"
            git push origin HEAD:main
          fi
