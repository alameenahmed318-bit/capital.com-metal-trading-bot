name: AL-ZOOL BTCUSD integration checks
on:
  push:
    branches:
      - deploy/alzool-meeno-btc-demo-20261121
      - work/alzool-dual-market-20261122
      - work/alzool-fast-strategy-lab-20261122
      - work/alzool-strategy-evidence-20261122
      - work/backtest-market-selector-20261122
      - work/alzool-stress-learning-20261122
  pull_request:
    branches:
      - work/alzool-foundation-20261114
      - deploy/alzool-meeno-btc-demo-20261121
  workflow_dispatch:
jobs:
  btc-support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check isolated market switching contract
        run: python -m unittest discover -s tests -p test_multi_market_switch.py -v
      - name: Check dual-market gateway
        run: python -m unittest discover -s tests -p test_dual_market_gateway.py -v
      - name: Check research comparison safety
        run: python -m unittest discover -s tests -p test_strategy_research.py -v
      - name: Check stress learning and chronological validation
        run: python -m unittest discover -s tests -p test_stress_learning.py -v
      - name: Check backend syntax
        run: python -m compileall -q marketplace/backend tests
      - name: Check BTCUSD market gates, learning and advisor signals
        run: python -m unittest discover -s tests -p 'test_btc*.py' -v
      - name: Compare all policy tests with deployed baseline
        env:
          BASELINE_SHA: 5d4f1a29aecece40a90e6007e22de7b6fe5b31ae
        run: |
          git fetch --depth=1 origin "$BASELINE_SHA"
          git worktree add --detach /tmp/alzool-baseline "$BASELINE_SHA"
          python - <<'PY'
          import subprocess,re,sys
          def run(path):
              p=subprocess.run([sys.executable,"-m","unittest","discover","-s","tests","-p","test_*.py","-v"],cwd=path,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              failures=set(re.findall(r"^(?:FAIL|ERROR): (.+)$",p.stdout,re.M))
              summary=re.findall(r"^Ran \d+ tests.*$|^FAILED.*$|^OK$",p.stdout,re.M)
              if not summary or (p.returncode and not failures):raise RuntimeError("Incomplete test run: "+p.stdout[-3000:])
              print(path,summary,flush=True)
              for f in sorted(failures):print("Failure:",f)
              return failures
          base=run("/tmp/alzool-baseline")
          new=run(".")
          print("Existing failures:",len(base),"Current failures:",len(new),"New failures:",len(new-base))
          if new-base:raise SystemExit("NEW REGRESSIONS: "+repr(sorted(new-base)))
          PY
      - name: Exact strategy parity and latency across GOLD and BTC regimes
        run: |
          git fetch --depth=1 origin 5ff86e115dd2f4bd93b47d1b1877df954a1e96e3
          python tests/strategy_speed_replay.py
      - name: Check production startup suite
        run: |
          python - <<'PY'
          import unittest
          suite=unittest.TestSuite()
          for pattern in ("test_owner_decisions.py","test_owner_recovery.py","test_recovery_action_protocol.py","test_hybrid_decision.py","test_position_sizing.py","test_entry_quality.py","test_live_learning.py","test_post_close_m1.py","test_recovery_candle_guard.py","test_local_ai_relay_cpu.py","test_position_action_safety.py","test_btc_market_gate.py","test_btc_market_symbols.py","test_btc_market_isolation.py","test_btc_adaptive_learning.py"):
              suite.addTests(unittest.defaultTestLoader.discover("tests",pattern=pattern))
          if not unittest.TextTestRunner(verbosity=1).run(suite).wasSuccessful():raise SystemExit(1)
          PY
      - name: Check updated dashboard JavaScript
        run: |
          node --check dashboard.js
          node --check multi-market-ui.js
          node tests/backtest_market_selector.cjs
      - name: Confirm live execution remains opt-in
        run: |
          grep -q 'input bool InpEnableCentralTrading = false;' mt5_client/ALZOOL_Central_Client.mq5
          grep -q 'input bool InpEnableCentralPositionManagement = false;' mt5_client/ALZOOL_Central_Client.mq5
          grep -q 'input bool InpEnableCentralTrading = false;' mt5_client/ALZOOL_Multi_Market_Client.mq5
          grep -q 'input bool InpEnableCentralPositionManagement = false;' mt5_client/ALZOOL_Multi_Market_Client.mq5
