name: Gold 1000 independent research tests
on:
  push:
    branches: [research/gold-1000-tests-20261126]
    paths: ['.github/workflows/gold-1000-tests.yml', 'research/gold_1000_walkforward.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gold-1000-research
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obtain public gold bid and ask candles
        run: |
          npm install --no-audit --no-fund dukascopy-node@1.51.1
          node --input-type=module <<'JS'
          import { getHistoricalRates } from 'dukascopy-node';
          import { writeFileSync } from 'node:fs';
          const data = {};
          for (const priceType of ['bid','ask']) {
            data[priceType] = await getHistoricalRates({instrument:'xauusd',dates:{from:'2026-08-03',to:'2026-08-20'},timeframe:'m1',priceType,format:'array',retryCount:3});
            if (!Array.isArray(data[priceType]) || data[priceType].length < 3000 || !Array.isArray(data[priceType][0])) throw new Error('Insufficient public M1 data');
            console.log(priceType, data[priceType].length, 'candles');
          }
          writeFileSync('gold.json',JSON.stringify(data));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: public-gold-input
          path: gold.json
          retention-days: 7
  test:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - model: TiRex-2
            package: tirex-2==0.5.0
            slug: tirex
          - model: Chronos-2
            package: chronos-forecasting>=2,<3
            slug: chronos2
          - model: Chronos-Bolt Tiny
            package: chronos-forecasting>=2,<3
            slug: bolt
          - model: TimesFM-2.5
            package: timesfm[torch]==2.0.2
            slug: timesfm
          - model: CatBoost
            package: catboost==1.2.8
            slug: catboost
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TORCH_COMPILE_DISABLE: '1'
      MODEL: ${{ matrix.model }}
      PACKAGE: ${{ matrix.package }}
      SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: public-gold-input
      - name: Install isolated CPU dependencies
        run: |
          python -m pip install numpy pandas scikit-learn requests
          if [ "$SLUG" != catboost ]; then python -m pip install torch --index-url https://download.pytorch.org/whl/cpu; fi
          python -m pip install "$PACKAGE"
      - name: Run 200 chronological scored cases
        run: |
          python -u research/gold_1000_walkforward.py --data gold.json --model "$MODEL" --output "reports/$SLUG.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-results-${{ matrix.slug }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
