name: Gold HARD V2 1000 independent research tests
on:
  pull_request:
    branches: [research/gold-1000-tests-20261126]
    paths: ['.github/workflows/gold-1000-tests.yml', 'research/gold_hard_1000.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gold-hard-1000-research
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Obtain pinned public gold bid and ask archive
        run: |
          python <<'PY'
          import csv, datetime, hashlib, io, json, math, urllib.request
          from pathlib import Path
          revision = '9d19afba6e1a1c2f9c4fbe85cb2fcf2778584dc7'
          root = f'https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/{revision}'
          def epoch(day):
              return int(datetime.datetime.fromisoformat(day).replace(tzinfo=datetime.timezone.utc).timestamp()*1000)
          first, last = epoch('2026-09-01'), epoch('2026-10-01')
          data, hashes = {}, {}
          for side in ('bid', 'ask'):
              url = f'{root}/xauusd/{side}/m1/xauusd_{side}_m1_2026_09.csv'
              with urllib.request.urlopen(url, timeout=90) as response:
                  blob = response.read(10000000)
              hashes[side] = hashlib.sha256(blob).hexdigest()
              records = {}
              for row in csv.DictReader(io.StringIO(blob.decode('utf-8-sig'))):
                  t = int(row['timestamp'])
                  if not first <= t < last:
                      continue
                  values = [float(row[k]) for k in ('open','high','low','close')]
                  o,h,l,c = values
                  if t % 60000 or not all(math.isfinite(v) and v>0 for v in values) or l>min(o,c) or h<max(o,c):
                      raise ValueError(f'Invalid {side} candle at {t}')
                  if t in records:
                      raise ValueError(f'Duplicate {side} candle at {t}')
                  records[t] = [t, *values]
              data[side] = records
              print(side, len(records), 'candles', 'sha256', hashes[side], flush=True)
          times = sorted(data['bid'].keys() & data['ask'].keys())
          times = [t for t in times if data['ask'][t][1]>=data['bid'][t][1] and data['ask'][t][4]>=data['bid'][t][4]]
          if len(times)<8000:
              raise RuntimeError('Insufficient aligned actual bid/ask M1 candles')
          out = {side:[data[side][t] for t in times] for side in ('bid','ask')}
          out['provenance'] = {'source':root,'sha256':hashes,'volume_available':False,'aligned_candles':len(times),'start_utc':first,'end_exclusive_utc':last}
          Path('gold.json').write_text(json.dumps(out,allow_nan=False))
          print('DATA_READY',len(times),'aligned actual candles; volume unavailable',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-gold-hard-input
          path: gold.json
          retention-days: 7
  test:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - model: TiRex-2
            package: tirex-2==0.1.1
            slug: tirex
          - model: Chronos-2
            package: chronos-forecasting>=2,<3
            slug: chronos2
          - model: Chronos-Bolt Tiny
            package: chronos-forecasting>=2,<3
            slug: bolt
          - model: TimesFM-2.5
            package: timesfm[torch]==2.0.2
            slug: timesfm
          - model: CatBoost
            package: catboost==1.2.8
            slug: catboost
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TORCH_COMPILE_DISABLE: '1'
      MODEL: ${{ matrix.model }}
      PACKAGE: ${{ matrix.package }}
      SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: public-gold-hard-input
      - name: Install isolated CPU dependencies
        run: |
          python -m pip install numpy pandas scikit-learn requests
          if [ "$SLUG" != catboost ]; then python -m pip install torch --index-url https://download.pytorch.org/whl/cpu; fi
          python -m pip install "$PACKAGE"
      - name: Run 200 chronological cases with three stress scenarios
        run: |
          python -u research/gold_hard_1000.py --data gold.json --model "$MODEL" --output "reports/$SLUG.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-hard-results-${{ matrix.slug }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
