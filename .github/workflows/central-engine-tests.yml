name: AL-ZOOL central engine tests

on:
  push:
    branches:
      - alzool-gold-sniper-web
  pull_request:
    branches:
      - alzool-gold-sniper-web
  workflow_dispatch:

jobs:
  central-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: |
          python -m compileall -q server_engine marketplace/backend
      - name: Run central management tests
        working-directory: server_engine
        run: |
          python -m unittest discover -s tests -v
