name: AL-ZOOL tests

on:
  push:
    branches:
      - alzool-gold-sniper-web
    paths:
      - ".github/workflows/alzool-tests.yml"
      - "server_engine/**"
      - "app.js"
  workflow_dispatch:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit and settings contract tests
        run: python -m unittest discover -s server_engine/tests -v
      - name: Check dashboard JavaScript syntax
        run: node --check app.js
