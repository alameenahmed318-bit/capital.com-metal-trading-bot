name: Capital V3 Rapid Profit Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "17,32,47,02 * * * *"

concurrency:
  # All strategies share one Capital.com account. Serialize the full
  # account-mutating run so V1/V2/V3/V4 cannot race on balance, positions,
  # daily-loss limits, or portfolio risk.
  group: capital-account-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sync to latest main before running
        run: |
          set -euo pipefail
          # Scheduled runs can wait in the account-wide concurrency queue.
          # The event checkout may therefore point to an older commit by the
          # time this job actually starts. Always execute the newest main code.
          git fetch origin main
          git reset --hard origin/main
          echo "EXECUTION_SHA=$(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Capital V3 bot
        run: python v3_bot.py
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_EMAIL: ${{ secrets.CAPITAL_EMAIL }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_BASE_URL: ${{ secrets.CAPITAL_BASE_URL }}
          CAPITAL_BASE_DEMO_URL: ${{ secrets.CAPITAL_BASE_DEMO_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IS_DEMO: ${{ secrets.IS_DEMO }}
          BALANCE_CAP: ${{ vars.BALANCE_CAP }}
          STRATEGY: ${{ vars.STRATEGY }}
          VOL_MANAGED_SIZING: "true"
          RISK_PER_TRADE: ${{ vars.RISK_PER_TRADE }}
          VOL_REGIME_MIN: ${{ vars.VOL_REGIME_MIN }}
          GITHUB_USERNAME: alameenahmed318-bit
          GITHUB_REPO: capital.com-metal-trading-bot

      - name: Persist V3 state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          STATE_DIR="$(mktemp -d)"
          trap 'rm -rf "$STATE_DIR"' EXIT

          STATE_FILES=(
            v3_strategy_positions.json
            v3_trades_state.json
            v3_bot_safety_state.json
            v3_open_positions.json
            v3_execution_quality.json
            v3_entry_rejections.json

          )

          for f in "${STATE_FILES[@]}"; do
            if [ -e "$f" ]; then cp -a "$f" "$STATE_DIR/$f"; fi
          done

          git reset --hard HEAD
          git pull --rebase -X theirs origin main

          for f in "${STATE_FILES[@]}"; do
            if [ -e "$STATE_DIR/$f" ]; then cp -a "$STATE_DIR/$f" "$f"; fi
          done

          EXISTING_STATE_FILES=()
          for f in "${STATE_FILES[@]}"; do
            if [ -e "$f" ]; then EXISTING_STATE_FILES+=( "$f" ); fi
          done

          if [ "${#EXISTING_STATE_FILES[@]}" -eq 0 ]; then
            echo "No V3 state files exist to persist."
            exit 0
          fi

          git add -f "${EXISTING_STATE_FILES[@]}"
          if git diff --cached --quiet; then
            echo "No V3 state changes to persist."
            exit 0
          fi

          git commit -m "Update V3 bot state [skip ci]"
          git push origin main || {
            git pull --rebase -X theirs origin main
            git push origin main
          }
