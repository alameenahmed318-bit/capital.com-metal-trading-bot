<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UAE Business AI Agent</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#0b1220;color:#eef2ff}
main{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:#121b2e;border:1px solid #263552;border-radius:16px;padding:18px}.big{font-size:28px;font-weight:700}
.feed{margin-top:18px}.event{padding:14px 0;border-bottom:1px solid #263552}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#183b2a}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main>
<h1>🧠 UAE Business AI Agent</h1>
<p>لوحة متابعة الوكيل — نسخة تشغيل أولية</p>
<section class="grid">
<div class="card"><div>الحالة</div><div class="big">🟢 يعمل</div></div>
<div class="card"><div>طلبات جديدة</div><div class="big" id="requests">0</div></div>
<div class="card"><div>عملاء محتملون</div><div class="big" id="leads">0</div></div>
<div class="card"><div>تحتاج موافقتك</div><div class="big" id="approvals">0</div></div>
</section>
<section class="card feed">
<h2>سجل نشاط الوكيل</h2>
<div id="feed"><div class="event">بانتظار اتصال محرك الوكيل...</div></div>
</section>
</main>
<script>
async function refresh(){
  try{
    const r=await fetch("/api/status");
    if(!r.ok)return;
    const s=await r.json();
    requests.textContent=s.requests; leads.textContent=s.leads; approvals.textContent=s.approvals;
  }catch(e){}
}
refresh(); setInterval(refresh,5000);
</script>
</body>
</html>
